<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minecraft | Verificação de Vaga</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Card Estilo UI do Minecraft -->
  <main class="mc-panel">
    <header class="mc-header">
      <div class="mc-badge">MODO SOBREVIVÊNCIA</div>
      <h1>TESTE DE APTIDÃO</h1>
      <p>Preencha seus atributos de jogador para verificar sua vaga na guilda.</p>
    </header>

    <form id="mcForm" class="mc-form">
      <div class="mc-field">
        <label for="nome">NICKNAME (NOME):</label>
        <input type="text" id="nome" placeholder="SEU NICK..." autocomplete="off" required>
      </div>

      <div class="mc-grid">
        <div class="mc-field">
          <label for="idade">IDADE (ANOS):</label>
          <input type="number" id="idade" placeholder="18" min="1" max="120" required>
        </div>

        <div class="mc-field">
          <label for="altura">ALTURA (M):</label>
          <input type="number" id="altura" step="0.01" placeholder="1.70" min="0.5" max="3.0" required>
        </div>
      </div>

      <!-- Botão no Estilo Minecraft -->
      <button type="submit" id="btnSubmit" class="mc-btn">
        <span>CRAFTAR VERIFICAÇÃO</span>
      </button>
    </form>
  </main>

  <!-- Modal Pop-Up de Resultado -->
  <div id="modalOverlay" class="mc-modal-overlay" aria-hidden="true">
    <div id="modalBox" class="mc-modal-box">
      <div id="statusIcon" class="mc-status-icon"></div>
      <h2 id="modalTitle">RESULTADO</h2>
      <p id="modalMessage" class="mc-modal-text"></p>
      <button id="modalCloseBtn" class="mc-btn mc-btn-dialog">ENTENDIDO / OK</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
